spring:
  application:
    name: flashtix
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:flashtix}
    username: ${DB_USER:flashtix}
    password: ${DB_PASS:flashtix}
    driver-class-name: org.postgresql.Driver
    
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    # Optional: ensure it starts from V1 if needed, but baseline handles existing
    
    # PERFORMANCE: HikariCP connection pool configuration
    hikari:
      # Max connections for high traffic
      maximum-pool-size: ${DB_POOL_SIZE:20}
      # Minimum idle connections
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      # 30 seconds max wait
      connection-timeout: 30000
      # 10 minutes idle before close
      idle-timeout: 600000
      # 30 minutes max connection lifetime
      max-lifetime: 1800000
      # Health check query
      connection-test-query: SELECT 1
      pool-name: FlashTixHikariPool
      
  jpa:
    hibernate:
      # Flyway will manage the schema, Hibernate will only validate
      ddl-auto: none
    # PERFORMANCE: Disable in production (env var)
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        
        # PERFORMANCE: Enable batch operations for bulk inserts/updates
        jdbc:
          # Process 50 statements per batch
          batch_size: 50
          # Optimize insert order
          order_inserts: true
          # Optimize update order
          order_updates: true
          
        # Query optimization
        query:
          # 10 second query timeout
          timeout: 10000
          # Increase plan cache
          plan_cache_max_size: 2048
          
        # Statistics for monitoring (disable in production if needed)
        generate_statistics: ${HIBERNATE_STATS:false}
        
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6380}
    timeout: 60000ms
    
    # PERFORMANCE: Lettuce connection pool configuration
    lettuce:
      pool:
        # Maximum connections
        max-active: 20
        # Maximum idle connections
        max-idle: 10
        # Minimum idle connections
        min-idle: 5
        # Max wait for connection
        max-wait: 2000ms
      shutdown-timeout: 100ms
      
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    default-encoding: UTF-8

# Server Configuration
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param
    include-exception: false

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:7eG1/inJrEApoJpb+z92njxRWEhpDssfm9UaxhQxG+Vs=}
  expiration: ${JWT_EXPIRATION:86400000}


# MinIO Configuration
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-name: ${MINIO_BUCKET_NAME:flashtix-images}
  secure: ${MINIO_SECURE:false}

# File Upload Configuration (deprecated - using MinIO now)
file:
  upload:
    dir: ${FILE_UPLOAD_DIR:uploads}

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    # Explicitly tell Swagger UI where to load the API docs from
    url: /api-docs
  show-actuator: false
  
#momo payment (SANDBOX - For Testing)
momo:
  partner-code: ${MOMO_PARTNER_CODE}
  access-key: ${MOMO_ACCESS_KEY}
  secret-key: ${MOMO_SECRET_KEY}
  endpoint: ${MOMO_ENDPOINT}
  create-url: ${MOMO_CREATE_URL}
  redirect-url: ${MOMO_REDIRECT_URL}
  ipn-url: ${MOMO_IPN_URL}

# Email Configuration
mail:
  from: ${MAIL_FROM}
  from-name: ${MAIL_FROM_NAME:FlashTix}