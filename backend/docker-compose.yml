version: "3.9"
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:flashtix}
      POSTGRES_USER: ${DB_USER:flashtix}
      POSTGRES_PASSWORD: ${DB_PASS:flashtix}
    ports:
      - "${DB_PORT}:${DB_PORT}"
    volumes:
      - pgdata:/var/lib/postgresql/data
